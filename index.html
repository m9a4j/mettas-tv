<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>METTAŞ TV | Video ve Canlı Hava Durumu</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07121e;color:#fff;font-family:Arial,Helvetica,sans-serif}.screen{height:100dvh;display:flex;flex-direction:column}.video-area{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;background:#02060a}video{width:100%;height:100%;object-fit:contain;display:block}.bar{height:116px;flex-shrink:0;background:linear-gradient(100deg,#0b2034,#102e49 60%,#071929);border-top:2px solid #e33238;display:flex;align-items:center;justify-content:space-between;padding:12px 4%;gap:18px}.weather{display:flex;align-items:center;gap:17px}.icon{font-size:46px}.location{font-size:16px;letter-spacing:1.5px;color:#c8d8e7;font-weight:700}.weather-details{display:flex;align-items:baseline;gap:16px}.temp{font-size:44px;font-weight:800}.condition{font-size:17px;color:#c8d8e7}.time{text-align:right}.clock{font-size:43px;font-weight:800}.date{font-size:17px;color:#c8d8e7}.fallback{display:none;position:absolute;top:25px;left:25px;background:#16283de8;padding:12px;border-radius:6px;font-size:15px}body.video-error .fallback{display:block}@media(max-width:700px){.bar{height:90px;padding:8px 3%;gap:8px}.icon{font-size:28px}.weather{gap:8px}.location,.date{font-size:11px}.temp,.clock{font-size:26px}.condition{font-size:11px}.weather-details{gap:5px}}
</style></head><body><div class="screen"><div class="video-area"><video id="film" autoplay muted loop playsinline preload="auto"><source src="mettas-video.mp4" type="video/mp4">Tarayıcınız video oynatmayı desteklemiyor.</video><div class="fallback" id="notice">Video yüklenemedi. İnternet bağlantısını ve mettas-video.mp4 dosyasını kontrol edin.</div></div><div class="bar"><div class="weather"><div class="icon" id="weatherIcon">🌤️</div><div><div class="location">ÇAYIROVA · KOCAELİ</div><div class="weather-details"><span class="temp" id="temperature">--°C</span><span class="condition" id="weatherText">Hava durumu yükleniyor...</span></div></div></div><div class="time"><div class="clock" id="clock">--:--</div><div class="date" id="date">—</div></div></div></div><script>
const film=document.getElementById('film');film.muted=true;function playVideo(){film.play().catch(()=>{});}film.addEventListener('canplay',playVideo);film.addEventListener('error',()=>document.body.classList.add('video-error'));document.addEventListener('visibilitychange',()=>{if(!document.hidden)playVideo()});playVideo();
function tick(){const d=new Date();document.getElementById('date').textContent=new Intl.DateTimeFormat('tr-TR',{day:'numeric',month:'long',year:'numeric',weekday:'long',timeZone:'Europe/Istanbul'}).format(d);document.getElementById('clock').textContent=new Intl.DateTimeFormat('tr-TR',{hour:'2-digit',minute:'2-digit',hour12:false,timeZone:'Europe/Istanbul'}).format(d)}tick();setInterval(tick,1000);
function describe(code){if(code===0)return ['☀️','Açık'];if(code<=3)return ['⛅','Parçalı bulutlu'];if(code<=48)return ['🌫️','Sisli'];if(code<=67)return ['🌧️','Yağmurlu'];if(code<=77)return ['❄️','Karlı'];if(code<=82)return ['🌦️','Sağanak yağışlı'];if(code<=86)return ['🌨️','Kar yağışlı'];if(code>=95)return ['⛈️','Gök gürültülü'];return ['🌤️','Değişken']}
async function weather(){try{const r=await fetch('https://api.open-meteo.com/v1/forecast?latitude=40.83444&longitude=29.4&current=temperature_2m,weather_code&timezone=Europe%2FIstanbul',{cache:'no-store'});if(!r.ok)throw Error('weather');const j=await r.json();const [icon,label]=describe(j.current.weather_code);document.getElementById('weatherIcon').textContent=icon;document.getElementById('temperature').textContent=Math.round(j.current.temperature_2m)+'°C';document.getElementById('weatherText').textContent=label}catch(e){document.getElementById('weatherText').textContent='Hava durumu güncellenemedi'}}weather();setInterval(weather,15*60*1000);
</script></body></html>
