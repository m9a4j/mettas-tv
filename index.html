<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mettaş Cıvata | Karşılama</title>
<style>
:root{--navy:#071d32;--red:#f22a40;--blue:#18b7ed}*{box-sizing:border-box}
html,body{height:100%;margin:0;font-family:Arial,"Segoe UI",sans-serif;color:#fff}body{background:#081e34;overflow:hidden}
/* The source photo has a pale center. Never render that center: show only its outer edges. */
.scene{position:fixed;inset:0;z-index:-2;overflow:hidden;background:#071a2e}
.scene::before,.scene::after{content:"";position:absolute;top:0;bottom:0;width:50%;background-image:url("fabrika-arka-plan.jpg");background-repeat:no-repeat;background-size:200% 100%;opacity:.8;pointer-events:none}
.scene::before{left:0;background-position:left center;-webkit-mask-image:linear-gradient(90deg,#000 0%,#000 20%,transparent 94%);mask-image:linear-gradient(90deg,#000 0%,#000 20%,transparent 94%)}
.scene::after{right:0;background-position:right center;-webkit-mask-image:linear-gradient(270deg,#000 0%,#000 20%,transparent 94%);mask-image:linear-gradient(270deg,#000 0%,#000 20%,transparent 94%)}
.scene-shade{position:fixed;inset:0;z-index:-1;pointer-events:none;background:linear-gradient(90deg,rgba(5,22,39,.25) 0%,rgba(5,22,39,.8) 30%,#071a2e 47%,#071a2e 53%,rgba(5,22,39,.8) 70%,rgba(5,22,39,.25) 100%),linear-gradient(180deg,rgba(5,19,33,.2),rgba(5,19,33,.12) 65%,rgba(5,19,33,.65))}
main{height:calc(100dvh - 116px);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:clamp(20px,3.5vh,38px) 4vw 4vh;text-align:center}
.brand-row{width:min(950px,78vw);display:flex;align-items:center;justify-content:space-between;gap:40px}
.brand{width:42%;min-width:0;display:flex;align-items:center;justify-content:center;flex-direction:column;padding:12px 22px 9px;background:#fff;border-radius:14px;box-shadow:0 12px 45px rgba(0,0,0,.14)}
.brand img{height:clamp(78px,11vh,122px);width:100%;object-fit:contain}.brand.schaaf img{height:clamp(70px,9vh,103px)}
.brand .tag{font-size:clamp(9px,.82vw,14px);font-weight:800;color:#08253e;letter-spacing:.025em;white-space:nowrap;margin-top:3px}
.brand-divider{width:1px;height:80px;background:linear-gradient(transparent,rgba(255,255,255,.55),transparent)}
.hero{margin:auto 0 3vh}.hero h1{font-size:clamp(46px,6.4vw,106px);font-weight:900;letter-spacing:.035em;line-height:1.04;margin:0;color:#ff3048;text-shadow:0 5px 25px rgba(0,0,0,.45)}
.hero h2{font-size:clamp(40px,5.3vw,88px);font-weight:900;letter-spacing:.035em;line-height:1.08;margin:7px 0 0;color:#fff;text-shadow:0 5px 25px rgba(0,0,0,.45)}
.accent{width:240px;max-width:40vw;height:5px;margin:23px auto 0;background:linear-gradient(90deg,var(--red) 50%,var(--blue) 50%);border-radius:4px}
.guest{width:min(960px,88vw);padding:18px 26px 23px;background:linear-gradient(90deg,transparent,rgba(5,27,47,.64) 18%,rgba(5,27,47,.64) 82%,transparent);border:none;border-radius:0;box-shadow:none;backdrop-filter:none}
.guest-name{font-size:clamp(34px,4.1vw,70px);font-weight:800;line-height:1.16;overflow-wrap:anywhere;color:#fff;text-shadow:0 3px 18px rgba(0,0,0,.45)}
.company{font-size:clamp(18px,1.65vw,27px);color:#b9d6e9;margin-top:8px}.welcome-note{font-size:clamp(16px,1.5vw,25px);margin-top:12px}.welcome-note-de{font-size:clamp(14px,1.2vw,20px);margin-top:5px;color:#c7d7e5}
footer{height:116px;background:rgba(3,21,38,.94);border-top:1px solid rgba(255,255,255,.17);display:flex;align-items:center;justify-content:space-between;padding:12px clamp(28px,10vw,185px);gap:30px;color:#fff}
.weather{display:flex;align-items:center;gap:22px}.weather-icon{font-size:55px}.place{font-size:clamp(15px,1.25vw,21px)}.temp{font-size:clamp(36px,3.3vw,58px);font-weight:800;line-height:1.06}.condition{font-size:clamp(13px,1.1vw,19px)}
.foot-divider{height:60px;width:1px;background:rgba(255,255,255,.3)}.timebox{text-align:left}.date{font-size:clamp(14px,1.2vw,21px)}.clock{font-size:clamp(36px,3.4vw,58px);font-weight:800;line-height:1.1}
@media(max-width:760px){main{height:calc(100dvh - 96px);padding:12px 3vw 2vh}.brand-row{width:96%;gap:10px}.brand{width:47%;padding:8px}.brand img{height:65px}.brand.schaaf img{height:60px}.brand .tag{font-size:7px;white-space:normal}.brand-divider{height:55px}.hero h1{font-size:clamp(32px,7vw,56px)}.hero h2{font-size:clamp(30px,6vw,50px)}.guest{width:96%;padding:14px 8px}.guest-name{font-size:clamp(26px,5vw,43px)}footer{height:96px;padding:8px 18px;gap:12px}.weather{gap:9px}.weather-icon{font-size:34px}.temp,.clock{font-size:31px}.foot-divider{height:48px}}
@media(max-height:650px){main{height:calc(100dvh - 88px);padding-top:7px;padding-bottom:8px}.brand img{height:62px}.brand.schaaf img{height:58px}.brand{padding:5px}.hero h1{font-size:min(5.7vw,65px)}.hero h2{font-size:min(4.7vw,54px)}.hero{margin:auto 0}.accent{margin-top:10px}.guest{padding:9px}.guest-name{font-size:min(3.7vw,42px)}footer{height:88px}}
</style>
</head>
<body>
<div class="scene" aria-hidden="true"></div><div class="scene-shade" aria-hidden="true"></div>
<main>
<header class="brand-row">
<div class="brand"><img src="mettas.png" alt="METTAŞ Cıvata"></div>
<div class="brand-divider" aria-hidden="true"></div>
<div class="brand schaaf"><img src="schaaf.png" alt="SCHAAF"><div class="tag">LEADING JOINING TECHNOLOGY BY SCHAAF</div></div>
</header>
<section class="hero"><h1>HOŞ GELDİNİZ</h1><h2>WILLKOMMEN</h2><div class="accent"></div></section>
<section class="guest"><div class="guest-name" id="guestName">Ali Kemal Karaağaç</div><div class="company" id="guestCompany">SCHAAF GmbH</div><div class="welcome-note">Ziyaretinizden memnuniyet duyuyoruz.</div><div class="welcome-note-de">Wir freuen uns über Ihren Besuch.</div></section>
</main>
<footer><div class="weather"><span class="weather-icon" id="weatherIcon">🌤️</span><div><div class="place">ÇAYIROVA · KOCAELİ</div><div class="temp" id="temperature">--°C</div><div class="condition" id="weatherText">Hava durumu yükleniyor...</div></div></div><div class="foot-divider"></div><div class="timebox"><div class="date" id="date"></div><div class="clock" id="clock"></div></div></footer>
<script>
const params=new URLSearchParams(location.search);
function setGuest(name,company){if(name)document.getElementById('guestName').textContent=name;if(company)document.getElementById('guestCompany').textContent=company}
setGuest(params.get('isim')||params.get('name'),params.get('firma')||params.get('company'));
fetch('config.json?ts='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('config');return r.json()}).then(c=>{
  const name=c.visitorName||c.guestName||c.guest_name||c.name||c.isim||c.visitor?.name||c.guest?.name;
  const company=c.visitorCompany||c.guestCompany||c.guest_company||c.company||c.firma||c.visitor?.company||c.guest?.company;
  setGuest(params.get('isim')||params.get('name')||name,params.get('firma')||params.get('company')||company);
}).catch(()=>{});
function tick(){const d=new Date();document.getElementById('date').textContent=new Intl.DateTimeFormat('tr-TR',{day:'numeric',month:'long',year:'numeric',weekday:'long',timeZone:'Europe/Istanbul'}).format(d);document.getElementById('clock').textContent=new Intl.DateTimeFormat('tr-TR',{hour:'2-digit',minute:'2-digit',hour12:false,timeZone:'Europe/Istanbul'}).format(d)}tick();setInterval(tick,1000);
function describe(code){if(code===0)return ['☀️','Açık'];if(code<=3)return ['⛅','Parçalı bulutlu'];if(code<=48)return ['🌫️','Sisli'];if(code<=67)return ['🌧️','Yağmurlu'];if(code<=77)return ['❄️','Karlı'];if(code<=82)return ['🌦️','Sağanak yağışlı'];if(code<=86)return ['🌨️','Kar yağışlı'];if(code>=95)return ['⛈️','Gök gürültülü'];return ['🌤️','Değişken']}
async function weather(){try{const r=await fetch('https://api.open-meteo.com/v1/forecast?latitude=40.83444&longitude=29.4&current=temperature_2m,weather_code&timezone=Europe%2FIstanbul',{cache:'no-store'});if(!r.ok)throw Error('weather');const j=await r.json();const [icon,label]=describe(j.current.weather_code);document.getElementById('weatherIcon').textContent=icon;document.getElementById('temperature').textContent=Math.round(j.current.temperature_2m)+'°C';document.getElementById('weatherText').textContent=label}catch(e){document.getElementById('weatherText').textContent='Hava durumu güncellenemedi'}}weather();setInterval(weather,15*60*1000);
</script>
</body></html>
