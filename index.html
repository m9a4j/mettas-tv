<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mettaş Cıvata | Karşılama</title>
<style>
:root{--navy:#082b4c;--red:#d50920;--blue:#00a6e8}*{box-sizing:border-box}
html,body{height:100%;margin:0;font-family:Arial,'Segoe UI',sans-serif;color:var(--navy)}
body{overflow:hidden;background:#e8eff4}
/* Unified backdrop: two softly masked industrial edges, no central rectangle. */
.scene{position:fixed;inset:0;z-index:-3;overflow:hidden;background:#eaf1f7}
.scene::before,.scene::after{content:"";position:absolute;inset:0;background-image:url("fabrika-arka-plan.jpg");background-size:cover;background-repeat:no-repeat;pointer-events:none}
.scene::before{background-position:center center;opacity:.83;-webkit-mask-image:linear-gradient(90deg,#000 0%,#000 10%,rgba(0,0,0,.7) 19%,transparent 39%);mask-image:linear-gradient(90deg,#000 0%,#000 10%,rgba(0,0,0,.7) 19%,transparent 39%)}
.scene::after{background-position:center center;opacity:.83;-webkit-mask-image:linear-gradient(270deg,#000 0%,#000 10%,rgba(0,0,0,.7) 19%,transparent 39%);mask-image:linear-gradient(270deg,#000 0%,#000 10%,rgba(0,0,0,.7) 19%,transparent 39%)}
/* Gentle unified veil across the entire display. */
body::before{content:"";position:fixed;inset:0 0 128px;z-index:-2;pointer-events:none;background:radial-gradient(ellipse 50% 85% at center,rgba(244,248,251,.70),rgba(244,248,251,.28) 68%,transparent 100%)}
main{height:calc(100dvh - 128px);min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:clamp(20px,3vh,40px) 5vw 3vh;text-align:center}
.brand-row{width:min(1040px,78vw);display:flex;align-items:center;justify-content:space-between;gap:6vw;min-height:135px}
.brand{width:40%;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:0}
.brand img{width:100%;height:clamp(90px,15vh,150px);object-fit:contain;mix-blend-mode:multiply}
.brand.schaaf img{height:clamp(80px,13vh,125px)}
.brand .tag{font-size:clamp(10px,1.05vw,18px);font-weight:800;letter-spacing:.02em;margin-top:3px;color:#0a2a43}
.brand-divider{height:clamp(85px,12vh,130px);width:2px;background:linear-gradient(transparent,#53728b,transparent);flex:none}
.hero{width:100%;margin:auto 0;transform:translateY(2vh)}
.hero h1{margin:0;font-size:clamp(43px,6.4vw,105px);letter-spacing:.025em;line-height:1.03;font-weight:900;color:var(--red);text-shadow:0 2px 20px rgba(255,255,255,.65)}
.hero h2{margin:6px 0 0;font-size:clamp(38px,5.1vw,84px);line-height:1.05;letter-spacing:.025em;font-weight:900;text-shadow:0 2px 18px rgba(255,255,255,.8)}
.accent{width:clamp(140px,18vw,275px);height:5px;margin:22px auto 0;background:linear-gradient(90deg,var(--red) 0 50%,var(--blue) 50%)}
.guest{width:min(980px,85vw);padding:18px 36px 24px;margin-top:1.5vh;border-radius:0;background:radial-gradient(ellipse at center,rgba(255,255,255,.54),rgba(255,255,255,.17) 63%,transparent 100%);border:0;box-shadow:none;backdrop-filter:none}
.guest-name{font-size:clamp(32px,4.1vw,70px);font-weight:800;line-height:1.13;overflow-wrap:anywhere}.company{font-size:clamp(17px,1.65vw,27px);color:#426481;margin-top:8px}.welcome-note{font-size:clamp(16px,1.55vw,25px);margin-top:12px}.welcome-note-de{font-size:clamp(14px,1.25vw,20px);margin-top:4px;color:#476580}
footer{height:128px;background:rgba(5,37,66,.96);color:white;display:flex;align-items:center;justify-content:space-between;padding:14px clamp(30px,9vw,175px);gap:30px}
.weather{display:flex;align-items:center;gap:22px}.weather-icon{font-size:58px;line-height:1}.place{font-size:clamp(15px,1.3vw,22px);font-weight:500}.temp{font-size:clamp(33px,3.4vw,57px);font-weight:800;line-height:1.05}.condition{font-size:clamp(13px,1.15vw,19px);margin-top:4px}
.foot-divider{height:62px;width:1px;background:rgba(255,255,255,.35)}.timebox{text-align:left}.date{font-size:clamp(14px,1.3vw,21px)}.clock{font-size:clamp(34px,3.5vw,58px);font-weight:800;line-height:1.1}
@media(max-width:750px){main{height:calc(100dvh - 104px);padding:14px 3vw}.brand-row{width:96%;gap:12px;min-height:75px}.brand{width:46%}.brand img,.brand.schaaf img{height:72px}.brand .tag{font-size:8px}.brand-divider{height:55px}.hero h1{font-size:clamp(32px,7vw,56px)}.hero h2{font-size:clamp(28px,6vw,49px)}.guest{width:94%;padding:16px}.guest-name{font-size:clamp(27px,5vw,45px)}footer{height:104px;padding:12px 20px}.weather-icon{font-size:35px}.weather{gap:10px}.foot-divider{height:50px}.temp{font-size:31px}.clock{font-size:33px}}
@media(max-height:650px){main{padding-top:8px;padding-bottom:10px}.brand img,.brand.schaaf img{height:80px}.hero{transform:none}.hero h1{font-size:min(5.7vw,65px)}.hero h2{font-size:min(4.6vw,55px)}.accent{margin-top:12px}.guest{padding:12px}.guest-name{font-size:min(3.7vw,42px)}footer{height:100px}main{height:calc(100dvh - 100px)}}
</style>
</head>
<body>
<div class="scene" aria-hidden="true"></div>
<main>
<header class="brand-row">
<div class="brand"><img src="mettas.png" alt="METTAŞ Cıvata"></div>
<div class="brand-divider" aria-hidden="true"></div>
<div class="brand schaaf"><img src="schaaf.png" alt="SCHAAF"><div class="tag">LEADING JOINING TECHNOLOGY BY SCHAAF</div></div>
</header>
<section class="hero"><h1>HOŞ GELDİNİZ</h1><h2>WILLKOMMEN</h2><div class="accent"></div></section>
<section class="guest"><div class="guest-name" id="guestName">Ali Kemal Karaağaç</div><div class="company" id="guestCompany">SCHAAF GmbH</div><div class="welcome-note">Ziyaretinizden memnuniyet duyuyoruz.</div><div class="welcome-note-de">Wir freuen uns über Ihren Besuch.</div></section>
</main>
<footer><div class="weather"><span class="weather-icon" id="weatherIcon">🌤️</span><div><div class="place">ÇAYIROVA · KOCAELİ</div><div class="temp" id="temperature">--°C</div><div class="condition" id="weatherText">Hava durumu yükleniyor...</div></div></div><div class="foot-divider"></div><div class="timebox"><div class="date" id="date"></div><div class="clock" id="clock"></div></div></footer>
<script>
const params=new URLSearchParams(location.search);
function setGuest(name,company){if(name)document.getElementById('guestName').textContent=name;if(company)document.getElementById('guestCompany').textContent=company}
setGuest(params.get('isim')||params.get('name'),params.get('firma')||params.get('company'));
fetch('config.json?ts='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('config');return r.json()}).then(c=>{
  const name=c.visitorName||c.guestName||c.guest_name||c.name||c.isim||c.visitor?.name||c.guest?.name;
  const company=c.visitorCompany||c.guestCompany||c.guest_company||c.company||c.firma||c.visitor?.company||c.guest?.company;
  setGuest(params.get('isim')||params.get('name')||name,params.get('firma')||params.get('company')||company);
}).catch(()=>{});
function tick(){const d=new Date();document.getElementById('date').textContent=new Intl.DateTimeFormat('tr-TR',{day:'numeric',month:'long',year:'numeric',weekday:'long',timeZone:'Europe/Istanbul'}).format(d);document.getElementById('clock').textContent=new Intl.DateTimeFormat('tr-TR',{hour:'2-digit',minute:'2-digit',hour12:false,timeZone:'Europe/Istanbul'}).format(d)}tick();setInterval(tick,1000);
function describe(code){if(code===0)return ['☀️','Açık'];if(code<=3)return ['⛅','Parçalı bulutlu'];if(code<=48)return ['🌫️','Sisli'];if(code<=67)return ['🌧️','Yağmurlu'];if(code<=77)return ['❄️','Karlı'];if(code<=82)return ['🌦️','Sağanak yağışlı'];if(code<=86)return ['🌨️','Kar yağışlı'];if(code>=95)return ['⛈️','Gök gürültülü'];return ['🌤️','Değişken']}
async function weather(){try{const r=await fetch('https://api.open-meteo.com/v1/forecast?latitude=40.83444&longitude=29.4&current=temperature_2m,weather_code&timezone=Europe%2FIstanbul',{cache:'no-store'});if(!r.ok)throw Error('weather');const j=await r.json();const [icon,label]=describe(j.current.weather_code);document.getElementById('weatherIcon').textContent=icon;document.getElementById('temperature').textContent=Math.round(j.current.temperature_2m)+'°C';document.getElementById('weatherText').textContent=label}catch(e){document.getElementById('weatherText').textContent='Hava durumu güncellenemedi'}}weather();setInterval(weather,15*60*1000);
</script>
</body></html>
