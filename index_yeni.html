<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache"><title>Mettaş Cıvata | Karşılama</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;color:#091e36;background:#eaf1f7}.screen{width:100%;min-height:100vh;display:flex;flex-direction:column;background:linear-gradient(90deg,rgba(246,250,255,.10),rgba(255,255,255,.70) 28%,rgba(255,255,255,.70) 72%,rgba(246,250,255,.10)),url("fabrika-arka-plan.jpg") center center/cover no-repeat;overflow:hidden}.head{height:25vh;min-height:160px;display:flex;align-items:center;justify-content:center;gap:4vw;padding:3vh 5vw}.logo{object-fit:contain;max-width:39%;max-height:19vh}.line{height:18vh;width:2px;background:#728396}.center{flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:1vh 5vw}.welcome{font-size:clamp(36px,6.5vw,110px);font-weight:900;color:#c90016;letter-spacing:.01em;line-height:1.04}.german{font-size:clamp(30px,5.3vw,92px);font-weight:850;color:#073968;line-height:1.1;margin-top:.4vh}.rule{height:5px;width:16vw;background:linear-gradient(90deg,#b50014 50%,#079ee3 50%);margin:2vh}.visitor{background:rgba(255,255,255,.91);border:1px solid #d4e0e9;border-radius:18px;padding:2vh 4vw;width:min(85%,1300px);box-shadow:0 6px 25px #16355215}.name{font-size:clamp(29px,4.5vw,76px);font-weight:800}.company{font-size:clamp(14px,1.6vw,26px);color:#476178;margin:.5vh}.msg{font-size:clamp(14px,1.8vw,29px);margin-top:1.4vh}.msg.de{font-size:clamp(12px,1.45vw,24px);color:#566779;margin-top:.6vh}.foot{background:rgba(8,38,66,.97);color:white;min-height:13vh;display:flex;align-items:center;justify-content:space-around;gap:2vw;padding:1.6vh 4vw}.weather{display:flex;align-items:center;gap:1.3vw}.symbol{font-size:clamp(27px,3vw,55px)}.temp{font-size:clamp(30px,3.6vw,65px);font-weight:700}.small{font-size:clamp(13px,1.45vw,24px)}.clock{font-size:clamp(26px,3.3vw,60px);font-weight:700}.divider{height:7vh;width:1px;background:#ffffff66}.error{font-size:clamp(12px,1.2vw,18px)}@media(max-width:600px){.head{height:20vh}.logo{max-width:42%}.center{padding:5vh 3vw}.visitor{width:95%}.foot{flex-wrap:wrap}.divider{display:none}}
</style></head><body><main class="screen"><header class="head"><img class="logo" src="mettas.png" alt="Mettaş Cıvata"><div class="line"></div><div style="width:39%;display:flex;flex-direction:column;align-items:center;gap:.7vh"><img src="schaaf.png" alt="SCHAAF" style="max-width:100%;max-height:15vh;object-fit:contain"><div style="font-size:clamp(10px,1.15vw,19px);font-weight:700;text-align:center">LEADING JOINING TECHNOLOGY BY SCHAAF</div></div></header><section class="center"><div class="welcome">HOŞ GELDİNİZ</div><div class="german">WILLKOMMEN</div><div class="rule"></div><div class="visitor"><div class="name" id="visitor">Ali Kemal Karaağaç</div><div class="company" id="company">SCHAAF GmbH</div><div class="msg" id="tr">Ziyaretinizden memnuniyet duyuyoruz.</div><div class="msg de" id="de">Wir freuen uns über Ihren Besuch.</div></div></section><footer class="foot"><div class="weather"><span class="symbol" id="weather-icon">🌤️</span><div><div class="small">ÇAYIROVA · KOCAELİ</div><div class="temp" id="temp">--°C</div><div class="small" id="condition">Hava durumu yükleniyor…</div></div></div><div class="divider"></div><div><div class="small" id="date">—</div><div class="clock" id="clock">--:--</div></div></footer></main>
<script>
const $=id=>document.getElementById(id);async function loadConfig(){try{const r=await fetch('config.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error();const c=await r.json();for(const [id,key] of [['visitor','visitor'],['company','company'],['tr','welcome_tr'],['de','welcome_de']])if(typeof c[key]==='string')$(id).textContent=c[key]}catch(e){}}function tick(){const d=new Date();$('clock').textContent=new Intl.DateTimeFormat('tr-TR',{timeZone:'Europe/Istanbul',hour:'2-digit',minute:'2-digit',hour12:false}).format(d);$('date').textContent=new Intl.DateTimeFormat('tr-TR',{timeZone:'Europe/Istanbul',day:'numeric',month:'long',year:'numeric',weekday:'long'}).format(d)}
function codeText(n){if(n===0)return ['☀️','Açık'];if([1,2,3].includes(n))return ['⛅','Parçalı bulutlu'];if([45,48].includes(n))return ['🌫️','Sisli'];if([51,53,55,56,57,61,63,65,66,67,80,81,82].includes(n))return ['🌧️','Yağmurlu'];if([71,73,75,77,85,86].includes(n))return ['❄️','Karlı'];if([95,96,99].includes(n))return ['⛈️','Gök gürültülü'];return ['🌤️','Hava durumu']}
async function weather(){try{const u='https://api.open-meteo.com/v1/forecast?latitude=40.83444&longitude=29.4&current=temperature_2m,weather_code&timezone=Europe%2FIstanbul';const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw Error();const d=await r.json();const c=d.current;const [ic,desc]=codeText(c.weather_code);$('weather-icon').textContent=ic;$('temp').textContent=Math.round(c.temperature_2m)+'°C';$('condition').textContent=desc}catch(e){$('condition').textContent='Hava durumu şu an alınamıyor'}}
loadConfig();tick();weather();setInterval(tick,1000);setInterval(loadConfig,60000);setInterval(weather,15*60*1000);
</script></body></html>
